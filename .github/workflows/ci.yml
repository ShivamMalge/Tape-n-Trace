name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Two bans live here (architecture.md §2.1, §10.1): the engine may not
      # import React or touch the DOM, and the renderers may not import the
      # engine at runtime. A violation fails the build rather than being left to
      # code review.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds are enforced by the vitest config, not by a later
      # step: under 90% on the engine is a failing run, not a warning. This is
      # the slowest job in CI at roughly five minutes, almost all of it the
      # exhaustive oracle agreement check.
      - name: Engine tests with coverage
        run: pnpm --filter @tape-n-trace/engine test:coverage

      - name: Renderer tests
        run: pnpm --filter @tape-n-trace/ui test

      # Includes the editor's keyboard-navigability and screen-reader checks
      # (§11.5), which are acceptance criteria rather than nice-to-haves.
      - name: Web app tests
        run: pnpm --filter @tape-n-trace/web test

      - name: Bridge tests
        run: pnpm --filter @tape-n-trace/bridge test

      - name: Build the web app
        run: pnpm --filter @tape-n-trace/web build

      # End-to-end: the production build in a real browser — pointer strokes on
      # the board, hydration, navigation, storage across a reload, phone widths.
      - name: Install Playwright's Chromium
        run: pnpm --filter @tape-n-trace/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @tape-n-trace/web e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The vyakarana gates (phases-vyakarana.md V4, §6): build the JS bundle,
  # prove it fresh, build the wheel through the jupyter-builder hook, install
  # that wheel — not the checkout — into a bare interpreter, and run pytest
  # against it. The matrix floor is 3.10 (pyproject); 3.13 is what Colab ships
  # (observed 2026-08-31). windows-latest is the no-compiler install check on
  # the second platform; the wheel is pure py3-none-any, so a compiler being
  # needed anywhere is a failing run.
  vyakarana:
    name: vyakarana wheel + pytest (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the bridge into vyakarana/static
        run: pnpm --filter @tape-n-trace/bridge build

      # Fails when static/ is missing or older than bridge/, packages/ui or
      # packages/engine — the staleness gate V1 promised to CI.
      - name: Bundle freshness
        run: pnpm --filter @tape-n-trace/bridge check-fresh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel vyakarana

      # The wheel just built, by path — never a version spec. `pip install
      # vyakarana==<version> --find-links dist` also matches the *released*
      # wheel of that version on PyPI, and pip may pick it: CI then tests the
      # last release instead of the commit, and a fix like the one that made
      # `options(max_steps=...)` work at all passes CI while still broken here.
      # The index stays on for the dependencies (anywidget, traitlets,
      # mini-racer), which only PyPI has. Globbed in Python, for Windows too.
      - name: Install the wheel, not the checkout
        run: |
          python -m pip install --quiet pytest jsonschema
          python -c "import glob, subprocess, sys; wheels = glob.glob('vyakarana/dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', wheels[0]])"

      # Proves the wheel under test is this commit's, not a release that
      # happens to share its version number.
      - name: The installed wheel is the one CI built
        run: python vyakarana/tests/check_installed.py

      # From the repo root, not vyakarana/ — with the project directory as the
      # cwd, `python -m pytest` would put the source tree ahead of the wheel on
      # sys.path and quietly test the checkout instead.
      # Capped: on Python 3.13 / Linux the interpreter once hung for 20+ minutes
      # after "48 passed", tearing down the embedded V8 at exit (the runtime now
      # closes it explicitly). A hang is a failure, not a six-hour wait.
      - name: pytest against the installed wheel
        timeout-minutes: 5
        run: python -m pytest -q vyakarana/tests

      - name: Keep the wheel CI built
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: vyakarana-wheel
          path: vyakarana/dist/*.whl
