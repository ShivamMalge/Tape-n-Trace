<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 224" role="img" aria-label="Tape-n-Trace">
  <!--
    The favicon, from the light and dark logo cards in docs/brand/: ink on
    paper by day, the paper rule and a lighter lit cell after dark. Browsers
    that honour media queries in SVG favicons (Chrome, Edge, Firefox) follow the
    system theme; the rest show the light mark.
  -->
  <style>
    .ink { stroke: #211E1A; }
    .lit { fill: #3B63C4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #EDE7DB; }
      .lit { fill: #6FA6F0; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="14" stroke-linejoin="miter" stroke-linecap="butt">
    <rect x="7" y="7" width="264" height="136" />
    <line x1="95" y1="7" x2="95" y2="143" />
    <line x1="183" y1="7" x2="183" y2="143" />
    <polyline points="143,143 143,210 7,210" />
  </g>
  <rect class="lit" x="102" y="14" width="74" height="122" />
</svg>
