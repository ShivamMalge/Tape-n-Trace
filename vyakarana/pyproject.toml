[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[project]
name = "vyakarana"
version = "0.1.0"
description = "The Python face of the Tape-n-Trace engine: build a machine in a notebook cell, watch the trace inline."
readme = "README.md"
# Floor per phases-vyakarana.md §9.3: set by what Colab ships, not assumed.
# Observed 2026-08-31: Colab runs Python 3.13.15 on Ubuntu 22.04 (its docs said
# 3.12). 3.10 keeps three versions of headroom without costing any syntax we use.
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5.0",
    "mini-racer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["vyakarana"]
# vyakarana/static/ is generated by `pnpm -F @tape-n-trace/bridge build`; the
# jupyter-builder hook below runs that build when static/ is absent, so the JS
# cannot be forgotten out of a wheel (phases-vyakarana.md V4).
artifacts = ["vyakarana/static/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["vyakarana/static/*"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "vyakarana/static/widget.js",
    "vyakarana/static/engine.js",
    "vyakarana/static/widget.css",
    "vyakarana/static/engine-manifest.json",
]
# An sdist carries static/ already built; installing one on a machine with no
# pnpm must not try to rebuild it.
skip-if-exists = ["vyakarana/static/widget.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = ["pnpm", "--filter", "@tape-n-trace/bridge"]
build_cmd = "build"
path = ".."

[tool.pytest.ini_options]
testpaths = ["tests"]
