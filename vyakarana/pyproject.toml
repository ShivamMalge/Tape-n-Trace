[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vyakarana"
version = "0.0.1"
description = "The Python face of the Tape-n-Trace engine: build a machine in a notebook cell, watch the trace inline."
readme = { text = "Unreleased development version. See documentation.md in the repository.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anywidget>=0.9",
    "traitlets>=5.0",
    "mini-racer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["vyakarana"]
# vyakarana/static/ is generated by `pnpm -F @tape-n-trace/bridge build` and
# must exist before a wheel is built; V4 wires hatch-jupyter-builder so it
# cannot be forgotten.
artifacts = ["vyakarana/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
